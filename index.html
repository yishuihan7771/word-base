<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<title>考公词语积累器</title>
<style>
  :root{
    --bg:#f6f7f9; --fg:#171a1f; --muted:#6b7280; --card:#fff; --line:#e4e7ec;
    --accent:#2e56fc; --accent-fg:#fff; --good:#12805c; --bad:#c0392b; --warn:#b26a00;
    --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --fg:#e8eaed; --muted:#9aa1ac; --card:#171a21; --line:#262b35;
      --accent:#7d97ff; --accent-fg:#0b0e14; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg); min-height:100vh;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:860px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
  header{padding:20px 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
  h1{font-size:20px;margin:0;letter-spacing:.3px}
  .meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--card)}
  .chip.stale{border-color:var(--warn);color:var(--warn)}
  button{
    font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--card);
    color:var(--fg);border-radius:10px;padding:7px 12px;
  }
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
  button.ghost{background:transparent}
  button:disabled{opacity:.45;cursor:default}
  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;position:sticky;top:0;background:var(--bg);z-index:5}
  nav.tabs button{border-radius:999px;white-space:nowrap}
  nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
  section[hidden]{display:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  input[type=search],input[type=text],textarea{
    width:100%;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;outline:none;
  }
  input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  textarea{min-height:130px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
  .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .result{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 6px;border-bottom:1px solid var(--line);cursor:pointer}
  .result:last-child{border-bottom:0}
  .result:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .result .w{font-size:17px;font-weight:600}
  .result .d{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
  .counter{font-size:12px;color:var(--muted);white-space:nowrap}
  dl.detail{margin:0;display:grid;grid-template-columns:5.5em 1fr;gap:6px 12px}
  dl.detail dt{color:var(--muted);font-size:13px;padding-top:2px}
  dl.detail dd{margin:0}
  .word-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .word-head .big{font-size:28px;font-weight:700;letter-spacing:1px}
  .tag{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted)}
  .tag.b{border-color:var(--good);color:var(--good)}
  .tag.p{border-color:var(--bad);color:var(--bad)}
  .tag.n{border-color:var(--muted)}
  .tag.warn{border-color:var(--warn);color:var(--warn)}
  table.freq{width:100%;border-collapse:collapse;font-size:14px}
  table.freq th,table.freq td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  table.freq th{color:var(--muted);font-weight:500;font-size:13px}
  table.freq td.num{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:7px;border-radius:4px;background:var(--accent);min-width:2px;display:block}
  .barwrap{background:color-mix(in srgb,var(--muted) 20%,transparent);border-radius:4px;overflow:hidden}
  .drill{text-align:center}
  .drill .front{font-size:40px;font-weight:700;letter-spacing:3px;margin:22px 0}
  .drill .flip{cursor:pointer;min-height:190px;display:flex;flex-direction:column;justify-content:center}
  .progress{color:var(--muted);font-size:13px;margin-top:6px}
  .empty{text-align:center;color:var(--muted);padding:26px 10px}
  .empty .big{font-size:34px;margin-bottom:8px}
  #toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;
    opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:88vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-size:12px;color:var(--muted)}
  @media (max-width:520px){
    dl.detail{grid-template-columns:1fr;gap:2px}
    dl.detail dt{margin-top:8px}
    .result .d{max-width:38vw}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>考公词语积累器</h1>
    <div class="meta">
      <span class="chip" id="ver">词库 —</span>
      <span class="chip" id="cnt">0 词</span>
      <button id="btn-update" class="ghost">检查更新</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="search" aria-selected="true">查询</button>
    <button role="tab" data-tab="stats">频率统计</button>
    <button role="tab" data-tab="drill">刷词模式</button>
    <button role="tab" data-tab="data">数据</button>
  </nav>

  <main>
    <!-- 功能一：查询词语 -->
    <section id="tab-search">
      <div class="card">
        <input type="search" id="q" placeholder="输入词语 / 拼音首字母 / 释义关键词，如 ycje、一蹴而就" autocomplete="off" enterkeyhint="search">
        <p class="hint">按 <kbd>/</kbd> 聚焦；回车查看第一条。</p>
      </div>
      <div class="card" id="results"></div>
    </section>

    <!-- 功能二：频率统计 -->
    <section id="tab-stats" hidden>
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <strong>使用频率</strong>
          <span class="counter" id="stats-sum"></span>
        </div>
        <p class="hint">「重复」= 同一词语在试卷分析词表里被反复收录的次数。</p>
      </div>
      <div class="card" style="padding:6px 12px"><table class="freq" id="freq-table"></table></div>
    </section>

    <!-- 功能三：刷词模式 -->
    <section id="tab-drill" hidden>
      <div class="card drill">
        <div class="row" style="justify-content:space-between">
          <span class="counter" id="drill-pos"></span>
          <select id="drill-filter" style="font:inherit;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)">
            <option value="all">全部词语</option>
            <option value="unknown">只看未掌握</option>
            <option value="seen">只看已刷过</option>
          </select>
        </div>
        <div class="flip" id="drill-card" title="点击翻开 / 合上">
          <div class="front" id="drill-word">—</div>
          <div id="drill-detail"></div>
        </div>
        <div class="row" style="justify-content:center;margin-top:14px">
          <button id="drill-prev">← 上一个</button>
          <button id="drill-flip">翻开 / 合上</button>
          <button id="drill-next">下一个 →</button>
        </div>
        <div class="row" style="justify-content:center;margin-top:10px">
          <button id="drill-unknown" class="ghost">还没掌握</button>
          <button id="drill-known" class="primary">已掌握</button>
        </div>
        <p class="progress">← → 切换，空格翻开，1 未掌握 / 2 已掌握</p>
      </div>
    </section>

    <!-- 数据 -->
    <section id="tab-data" hidden>
      <div class="card">
        <strong>本机词库</strong>
        <p class="hint">词库以 <code>words.json</code> 为准，每次打开自动检查更新，不需要手动维护。双击打开本页（file://）时浏览器不允许自动读取，用下面按钮选一次文件即可。</p>
        <div class="row" style="margin-top:10px">
          <button id="btn-import-file" class="primary">选择 words.json 导入</button>
          <input type="file" id="file-input" accept=".json,application/json" hidden>
        </div>
      </div>
      <div class="card">
        <strong>备份与清理</strong>
        <p class="hint">导出的只有本机的查询与掌握记录。<strong>清除本机数据</strong>会连词库缓存一起清掉，联网状态下会自动重新拉取。</p>
        <div class="row" style="margin-top:10px">
          <button id="btn-export">导出统计 JSON</button>
          <button id="btn-reset" class="ghost">清空统计</button>
          <button id="btn-clear-all" class="ghost">清除本机数据</button>
        </div>
      </div>
      <div class="card">
        <strong>词库状态</strong>
        <div id="db-status" class="hint" style="margin-top:8px"></div>
      </div>
    </section>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

const DB_URL = "words.json";
const K_DB = "kg.db.v1";        // cached library {version, updated, words[]}
const K_STATS = "kg.stats.v1";  // per word: {q, known, unknown, collected, dup, last}
const K_LEGACY_LOCAL = "kg.local.v1"; // retired: words used to be addable by hand, local-only

const $ = (id) => document.getElementById(id);
const state = { db: { version: "—", updated: "", words: [] }, stats: {}, drill: { i: 0, flipped: false, filter: "all", list: [] } };

// ---------------------------------------------------------------- storage

function loadStore() {
  try { state.stats = JSON.parse(localStorage.getItem(K_STATS) || "{}") || {}; } catch { state.stats = {}; }
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(K_DB) || "null"); } catch { cached = null; }
  if (cached && Array.isArray(cached.words)) state.db = cached;
}
const saveStats = () => localStorage.setItem(K_STATS, JSON.stringify(state.stats));
const saveDb = () => localStorage.setItem(K_DB, JSON.stringify(state.db));

// Wipe everything this page keeps on this device and start over. The library is re-fetched when
// the page can reach words.json, so clearing it is not destructive on the deployed site.
async function clearLocalData() {
  if (!confirm("清除本机数据？将删掉这台设备上的词库缓存和查询/掌握记录。联网状态下会立刻重新拉取词库。")) return;
  for (const key of [K_DB, K_STATS, K_LEGACY_LOCAL]) localStorage.removeItem(key);
  state.stats = {};
  state.db = { version: "—", updated: "", words: [] };
  renderMeta(false);
  renderAll();
  toast("已清除本机数据");
  if (location.protocol !== "file:") await checkUpdate(false);
}

// ---------------------------------------------------------------- library

function allWords() {
  const seen = new Set();
  const out = [];
  for (const w of state.db.words) { if (!seen.has(w.w)) { seen.add(w.w); out.push(w); } }
  return out;
}
const findWord = (v) => allWords().find((w) => w.w === v) || null;

function stat(v) {
  if (!state.stats[v]) state.stats[v] = { q: 0, known: 0, unknown: 0, collected: 0, dup: 0, last: 0 };
  return state.stats[v];
}

function renderMeta(note) {
  $("ver").textContent = "词库 " + state.db.version;
  $("cnt").textContent = allWords().length + " 词";
  if (note) $("ver").classList.toggle("stale", !!note);
  const inUse = Object.values(state.stats).filter((s) => s.q || s.known || s.unknown || s.collected).length;
  $("db-status").innerHTML =
    "版本：<strong>" + esc(state.db.version) + "</strong>" +
    (state.db.updated ? "（" + esc(state.db.updated) + "）" : "") + "<br>" +
    "词条：" + state.db.words.length + " 条<br>" +
    "本机有记录的词：" + inUse + " 条<br>" +
    "数据存放：这台设备的浏览器 localStorage，不会同步到别的设备";
}

// Pull the published library and swap it in when the version changed.
async function checkUpdate(manual) {
  if (location.protocol === "file:") {
    if (manual) toast("双击打开时浏览器禁止读取 words.json，请用本地服务或直接拖入文件");
    renderMeta(false);
    return;
  }
  try {
    const res = await fetch(DB_URL + "?v=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const fresh = await res.json();
    if (!Array.isArray(fresh.words)) throw new Error("words 字段不是数组");
    const old = state.db.version;
    const changed = fresh.version !== old && fresh.words.length !== 0;
    state.db = { version: fresh.version || "—", updated: fresh.updated || "", words: fresh.words };
    saveDb();
    renderMeta(false);
    renderAll();
    if (changed) toast(old === "—" ? "词库已载入 " + state.db.version : "词库已更新 " + old + " → " + state.db.version);
    else if (manual) toast("已是最新版本 " + state.db.version);
  } catch (err) {
    if (manual) toast("检查更新失败：" + err.message);
    renderMeta(true);
  }
}

// ---------------------------------------------------------------- search

function score(word, q) {
  const w = word.w;
  if (w === q) return 100;
  if (word.abbr && word.abbr.toLowerCase().startsWith(q)) return 90;
  if (w.startsWith(q)) return 80;
  if (w.includes(q)) return 70;
  if (word.py && word.py.replace(/\s+/g, "").includes(q)) return 55;
  if ((word.tags || []).join(" ").toLowerCase().includes(q)) return 40;
  return 0;
}

function search(q) {
  q = q.trim().toLowerCase();
  if (!q) {
    // no query: surface what he has been looking at, newest first
    return allWords().slice().sort((a, b) => (stat(b.w).last | 0) - (stat(a.w).last | 0)).slice(0, 12);
  }
  const hits = [];
  for (const w of allWords()) {
    const direct = score(w, q);
    let loose = 0;
    if (!direct) {
      const hay = [w.def, w.key, w.modifies, w.subject, w.pos, w.tone].join(" ").toLowerCase();
      if (hay.includes(q)) loose = 20;
    }
    const s = direct || loose;
    if (s) hits.push([s, w]);
  }
  hits.sort((a, b) => b[0] - a[0] || a[1].w.length - b[1].w.length);
  return hits.slice(0, 40).map((x) => x[1]);
}

// Every lookup is a data point for 功能二.
function openWord(value, countIt) {
  const w = findWord(value);
  if (!w) return;
  if (countIt !== false) {
    const s = stat(w.w);
    s.q += 1;
    s.last = Date.now();
    saveStats();
  }
  $("results").innerHTML = detailHtml(w);
  renderMeta(false);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

const toneClass = (t) => (t === "褒" ? "tag b" : t === "贬" ? "tag p" : "tag n");

function detailHtml(w, withActions) {
  const s = stat(w.w);
  const rows = [
    ["意思和要点", esc(w.def || "（待补释义）") + (w.key ? "<br><span style='color:var(--muted)'>辨析：" + esc(w.key) + "</span>" : "")],
    ["词性", esc(w.pos || "—")],
    ["褒贬意", "<span class='" + toneClass(w.tone) + "'>" + esc(w.tone || "—") + "</span>"],
    ["用来修饰", esc(w.modifies || "—")],
    ["主语", esc(w.subject || "—")],
  ];
  if (w.seen) {
    rows.push(["选项出现", w.seen + " 次，其中正确答案 " + (w.hit || 0) + " 次"]);
  }
  if (!w.def) rows.push(["状态", "<span class='tag warn'>待补释义</span>"]);
  rows.push(["使用", "查询 " + s.q + " 次 · 收录 " + s.collected + " 次" + (s.dup ? " · 重复 " + s.dup + " 次" : "")]);
  const actions = withActions === false ? "" :
    "<div class='row' style='margin-top:14px'>" +
      "<button data-mark='known' data-w='" + esc(w.w) + "'>已掌握</button>" +
      "<button data-mark='unknown' data-w='" + esc(w.w) + "' class='ghost'>还没掌握</button>" +
      "<button class='ghost' onclick=\"document.getElementById('q').value='';renderResults()\">返回列表</button>" +
    "</div>";
  return "<div class='word-head'><span class='big'>" + esc(w.w) + "</span>" +
    (w.py ? "<span class='counter'>" + esc(w.py) + "</span>" : "") +
    (w.tags || []).map((t) => "<span class='tag'>" + esc(t) + "</span>").join("") + "</div>" +
    "<dl class='detail'>" + rows.map((r) => "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>").join("") + "</dl>" +
    actions;
}

function renderResults() {
  const q = $("q").value;
  const list = search(q);
  if (!allWords().length) {
    // First run from a double-clicked file: the browser refuses to read a sibling words.json, so
    // offer the one-click import instead of a dead end.
    const why = location.protocol === "file:"
      ? "双击打开时浏览器不允许本页自己读取同目录的 words.json。点下面按钮选一次，词库就会存在本机，之后双击打开都能直接搜。"
      : "词库还没载入。到「数据」页导入 words.json，或用本地服务打开本页。";
    $("results").innerHTML = "<div class='empty'><div class='big'>📚</div>" + why +
      "<div style='margin-top:16px'><button data-import='1' class='primary'>选择 words.json 导入</button></div></div>";
    return;
  }
  if (!list.length) { $("results").innerHTML = "<div class='empty'>没有匹配的词语。</div>"; return; }
  $("results").innerHTML = list.map((w) => {
    const s = stat(w.w);
    return "<div class='result' data-open='" + esc(w.w) + "'>" +
      "<div><div class='w'>" + esc(w.w) + "</div><div class='d'>" + esc(w.def || "待补释义") + "</div></div>" +
      "<div class='counter'>" + (s.q ? "查 " + s.q : "") + (s.dup ? " · 重" + s.dup : "") + "</div>" +
    "</div>";
  }).join("");
}

// ---------------------------------------------------------------- stats view

function renderStats() {
  const rows = allWords().map((w) => {
    const s = stat(w.w);
    return { w: w.w, ...s };
  }).filter((r) => r.q || r.collected || r.dup || r.known || r.unknown);
  rows.sort((a, b) => b.q + b.collected - (a.q + a.collected));
  const max = Math.max(1, ...rows.map((r) => r.q + r.collected));
  $("stats-sum").textContent = rows.length + " / " + allWords().length + " 个词有记录";
  if (!rows.length) {
    $("freq-table").innerHTML = "<tr><td class='empty'>还没有查询记录。查过的词会自动出现在这里。</td></tr>";
    return;
  }
  $("freq-table").innerHTML =
    "<tr><th>词语</th><th>查询</th><th>收录</th><th>重复</th><th>掌握</th><th style='width:22%'>占比</th></tr>" +
    rows.map((r) => "<tr>" +
      "<td>" + esc(r.w) + "</td>" +
      "<td class='num'>" + r.q + "</td>" +
      "<td class='num'>" + r.collected + "</td>" +
      "<td class='num'" + (r.dup ? " style='color:var(--warn)'" : "") + ">" + (r.dup ? "⚠ " + r.dup : "0") + "</td>" +
      "<td class='num'>" + (r.unknown ? "<span style='color:var(--bad)'>未" + r.unknown + "</span>" : "") +
        (r.known ? " <span style='color:var(--good)'>已" + r.known + "</span>" : "") + "</td>" +
      "<td><span class='barwrap'><span class='bar' style='width:" + Math.round((r.q + r.collected) / max * 100) + "%'></span></span></td>" +
    "</tr>").join("");
}

// ---------------------------------------------------------------- drill view

function buildDrillList() {
  let list = allWords();
  if (state.drill.filter === "unknown") list = list.filter((w) => stat(w.w).unknown > 0);
  else if (state.drill.filter === "seen") list = list.filter((w) => stat(w.w).q || stat(w.w).known || stat(w.w).unknown);
  state.drill.list = list;
  if (state.drill.i >= list.length) state.drill.i = 0;
  renderDrill();
}

function renderDrill() {
  const list = state.drill.list;
  const w = list[state.drill.i];
  $("drill-pos").textContent = list.length ? (state.drill.i + 1) + " / " + list.length : "没有卡片";
  if (!w) { $("drill-word").textContent = "—"; $("drill-detail").innerHTML = ""; return; }
  $("drill-word").textContent = w.w;
  $("drill-detail").innerHTML = state.drill.flipped
    ? "<div style='text-align:left'>" + detailHtml(w, false).replace(/^<div class='word-head'>[\s\S]*?<\/div>/, "") + "</div>"
    : "<p class='hint'>点击卡片看释义（空格）</p>";
  const s = stat(w.w);
  $("drill-known").textContent = s.known ? "已掌握 ×" + s.known : "已掌握";
  $("drill-unknown").textContent = s.unknown ? "还没掌握 ×" + s.unknown : "还没掌握";
}

function drillMove(delta) {
  const list = state.drill.list;
  if (!list.length) return;
  state.drill.i = (state.drill.i + delta + list.length) % list.length;
  state.drill.flipped = false;
  renderDrill();
}

function drillMark(kind) {
  const w = state.drill.list[state.drill.i];
  if (!w) return;
  const s = stat(w.w);
  s[kind] += 1;
  s.last = Date.now();
  saveStats();
  renderStats();
  drillMove(1);
}

// ---------------------------------------------------------------- import / export

function exportJson() {
  const payload = {
    exportedAt: new Date().toISOString(),
    dbVersion: state.db.version,
    stats: state.stats
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kaogong-vocab-stats-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已导出");
}

// The only file this page imports is words.json (needed when opened via file://).
function readFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let json;
    try {
      json = JSON.parse(String(reader.result));
    } catch {
      toast("这个文件不是有效的 JSON");
      return;
    }
    if (!Array.isArray(json.words)) {
      toast("这个 JSON 里没有 words 字段，不是词库文件");
      return;
    }
    const old = state.db.version;
    state.db = { version: json.version || "本地导入", updated: json.updated || "", words: json.words };
    saveDb();
    renderMeta(false);
    renderAll();
    toast("词库已导入 " + (old === "—" ? "" : old + " → ") + state.db.version + "（" + json.words.length + " 条）");
  };
  reader.readAsText(file, "utf-8");
}

// ---------------------------------------------------------------- plumbing

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function renderAll() { renderResults(); renderStats(); buildDrillList(); }

// A real pointer (mouse/trackpad) means a keyboard is already there and focusing the box is
// helpful. On a touch screen focusing it would pop the soft keyboard the moment a tab is tapped,
// so the user has to dismiss it before doing anything.
function hasHardwareKeyboard() {
  try {
    return !!(window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches);
  } catch { return false; }
}

function switchTab(name) {
  for (const b of document.querySelectorAll("nav.tabs button")) b.setAttribute("aria-selected", String(b.dataset.tab === name));
  for (const s of document.querySelectorAll("main > section")) s.hidden = s.id !== "tab-" + name;
  if (name === "search" && hasHardwareKeyboard()) $("q").focus();
  if (name === "drill") buildDrillList();
}

function wire() {
  document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => switchTab(b.dataset.tab)));
  $("q").addEventListener("input", renderResults);
  $("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const first = search($("q").value)[0];
      if (first) openWord(first.w);
    }
  });
  $("results").addEventListener("click", (e) => {
    if (e.target.closest("[data-import]")) { $("file-input").click(); return; }
    const row = e.target.closest("[data-open]");
    if (row) { openWord(row.dataset.open); return; }
    const mark = e.target.closest("[data-mark]");
    if (mark) {
      const s = stat(mark.dataset.w);
      s[mark.dataset.mark] += 1;
      saveStats();
      openWord(mark.dataset.w, false);
      toast(mark.dataset.mark === "known" ? "已记为掌握" : "已记为未掌握");
    }
  });
  $("btn-update").addEventListener("click", () => checkUpdate(true));
  $("btn-import-file").addEventListener("click", () => $("file-input").click());
  $("file-input").addEventListener("change", (e) => { if (e.target.files[0]) readFile(e.target.files[0]); e.target.value = ""; });
  $("btn-export").addEventListener("click", exportJson);
  $("btn-clear-all").addEventListener("click", clearLocalData);
  $("btn-reset").addEventListener("click", () => {
    if (!confirm("清空所有查询与掌握记录？词库本身不受影响。")) return;
    state.stats = {};
    saveStats();
    renderAll();
    toast("统计已清空");
  });
  $("drill-card").addEventListener("click", (e) => {
    if (e.target.closest("button")) return;
    state.drill.flipped = !state.drill.flipped;
    renderDrill();
  });
  $("drill-flip").addEventListener("click", () => { state.drill.flipped = !state.drill.flipped; renderDrill(); });
  $("drill-prev").addEventListener("click", () => drillMove(-1));
  $("drill-next").addEventListener("click", () => drillMove(1));
  $("drill-known").addEventListener("click", () => drillMark("known"));
  $("drill-unknown").addEventListener("click", () => drillMark("unknown"));
  $("drill-filter").addEventListener("change", (e) => { state.drill.filter = e.target.value; state.drill.i = 0; buildDrillList(); });
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input,textarea")) return;
    const onDrill = !$("tab-drill").hidden;
    if (e.key === "/") { e.preventDefault(); switchTab("search"); }
    else if (onDrill && e.key === "ArrowLeft") drillMove(-1);
    else if (onDrill && e.key === "ArrowRight") drillMove(1);
    else if (onDrill && (e.key === " " || e.key === "Enter")) { e.preventDefault(); state.drill.flipped = !state.drill.flipped; renderDrill(); }
    else if (onDrill && e.key === "1") drillMark("unknown");
    else if (onDrill && e.key === "2") drillMark("known");
  });
}

loadStore();
wire();
renderMeta(false);
renderAll();
checkUpdate(false);
</script>
</body>
</html>
